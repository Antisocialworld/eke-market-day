services:
  postgres:
    image: postgres:16-alpine
    container_name: eke-market-day-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eke
      POSTGRES_DB: eke_market_day
      # Local, throwaway dev database: trust auth, no password exists,
      # so there is no credential anywhere to leak or commit.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eke -d eke_market_day"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eke_market_day_pgdata:/var/lib/postgresql/data

volumes:
  eke_market_day_pgdata: